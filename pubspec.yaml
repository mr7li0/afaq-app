name: afaq
description: آفاق - An offline-first bilingual Islamic Super-App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────
  provider: ^6.1.1

  # ── Local Storage ─────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ── Audio Playback ────────────────────────────────────
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # ── Local Notifications ───────────────────────────────
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2

  # ── Prayer Times & Astronomical ───────────────────────
  adhan: ^2.0.0
  flutter_compass: ^0.8.0

  # ── Location ──────────────────────────────────────────
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # ── SVG Rendering ─────────────────────────────────────
  flutter_svg: ^2.0.9

  # ── Video Engine ──────────────────────────────────────
  video_player: ^2.8.1

  # ── UI & Utilities ────────────────────────────────────
  intl: ^0.20.3
  path_provider: ^2.1.1
  url_launcher: ^6.2.1

  permission_handler: ^11.1.0
  collection: ^1.18.0

  # ── Hijri Date ────────────────────────────────────────
  hijri: ^3.0.0

  # ── Connectivity ──────────────────────────────────────
  connectivity_plus: ^5.0.2

  # ── File Operations ────────────────────────────────
  file_picker: ^8.1.7
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # ── Audio Assets ──────────────────────────────────
    - assets/audio/notifications/
    # ── Ambient Audio (placeholder for future additions)
    # - assets/audio/ambient/

    # ── Data Assets ───────────────────────────────────
    - assets/data/

    # ── Image Assets ──────────────────────────────────
    - assets/images/

    # ── Icon Assets ───────────────────────────────────
    - assets/icons/

    # ── Language Assets ───────────────────────────────
    - assets/lang/

  fonts:
    # ── Arabic UI Font ────────────────────────────────
    - family: Milan
      fonts:
        - asset: assets/fonts/system-fonts/Milan Display Black Swashes.otf

    # ── Surah Name Font (Ejazah) ─────────────────────
    - family: SurahName
      fonts:
        - asset: assets/fonts/quran-fonts/Surah Name Ejazah @Am9li9.ttf

    # ── Quran Script Font (Uthmani) ───────────────────
    - family: Uthmani
      fonts:
        - asset: assets/fonts/quran-fonts/KFGQPC-HAFS Uthmanic-V22.ttf



