<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>آفاق - المعرض</title>
  <meta name="description" content="معرض تصاميم آفاق">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/kufam-font.js"></script>
  <style>
    /* ===== GALLERY PAGE ===== */
    .gallery-page { padding-top:calc(var(--nav-height) + 20px); padding-bottom:40px; direction:rtl; }
    .gallery-page .container { max-width:1200px; margin:0 auto; padding:0 20px; }
    .gallery-page .section-title { font-size:28px; font-weight:600; color:var(--ivory); margin:0 0 4px; }
    .gallery-page .section-subtitle { color:var(--ivory-dark); font-size:14px; margin:0 0 32px; opacity:0.7; }

    /* Filter tabs */
    .gallery-filters { display:flex; gap:6px; margin-bottom:28px; flex-wrap:wrap; }
    .gallery-filter {
      padding:6px 16px; border-radius:20px; border:1px solid var(--primary-deeper);
      background:transparent; color:var(--ivory-dark); cursor:pointer;
      font-size:13px; font-family:var(--font-body); transition:all 0.2s;
    }
    .gallery-filter:hover { border-color:var(--accent); color:var(--ivory); }
    .gallery-filter.active { background:var(--accent-dim); border-color:var(--accent); color:var(--ivory); }

    /* Grid layout */
    .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .gallery-item {
      border-radius:14px; overflow:hidden;
      background:var(--bg-card); border:1px solid var(--primary-deeper);
      transition:all 0.25s; cursor:pointer; position:relative;
    }
    .gallery-item:hover { transform:translateY(-3px); border-color:var(--accent); box-shadow:0 8px 24px var(--shadow-heavy); }
    .gallery-item-img {
      width:100%; aspect-ratio:1; object-fit:cover;
      background:var(--bg-dark); display:block;
    }
    .gallery-item-info { padding:12px 14px 14px; }
    .gallery-item-title { font-size:14px; font-weight:500; color:var(--ivory); margin:0 0 2px; }
    .gallery-item-desc { font-size:12px; color:var(--ivory-dark); opacity:0.6; margin:0; }

    /* Series badge */
    .gallery-item-badge {
      position:absolute; top:10px; left:10px;
      padding:4px 10px; border-radius:6px;
      background:var(--accent-dim); color:var(--accent);
      font-size:11px; font-weight:500; border:1px solid var(--accent);
    }

    /* Album / Series page */
    .series-header { margin-bottom:28px; }
    .series-header h2 { font-size:24px; color:var(--ivory); margin:0 0 6px; }
    .series-header p { font-size:14px; color:var(--ivory-dark); opacity:0.7; margin:0; }
    .series-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }

    /* Lightbox */
    .lightbox {
      position:fixed; inset:0; z-index:20000;
      background:rgba(0,0,0,0.85); display:none;
      align-items:center; justify-content:center;
    }
    .lightbox.open { display:flex; }
    .lightbox-img { max-width:90vw; max-height:85vh; border-radius:12px; box-shadow:0 16px 64px rgba(0,0,0,0.6); }
    .lightbox-close {
      position:fixed; top:20px; left:20px; z-index:20001;
      width:40px; height:40px; border-radius:50%; border:none;
      background:rgba(255,255,255,0.1); color:var(--ivory);
      font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .lightbox-close:hover { background:rgba(255,255,255,0.2); }
    .lightbox-nav {
      position:fixed; top:50%; transform:translateY(-50%);
      width:44px; height:44px; border-radius:50%; border:none;
      background:rgba(255,255,255,0.08); color:var(--ivory);
      font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .lightbox-nav:hover { background:rgba(255,255,255,0.15); }
    .lightbox-prev { right:20px; }
    .lightbox-next { left:20px; }

    /* Placeholder for missing images */
    .gallery-placeholder {
      width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
      background:var(--bg-dark); color:var(--ivory-dark); opacity:0.3;
    }
    .gallery-placeholder svg { width:48px; height:48px; }

    /* Carousel inside item */
    .gallery-carousel { position:relative; }
    .carousel-track { display:flex; overflow-x:auto; gap:4px; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
    .carousel-track::-webkit-scrollbar { display:none; }
    .carousel-item { flex:0 0 100%; scroll-snap-align:start; aspect-ratio:1; object-fit:cover; }
    .carousel-dots { display:flex; gap:4px; justify-content:center; padding:8px 0 0; }
    .carousel-dot { width:6px; height:6px; border-radius:50%; background:var(--ivory-dark); opacity:0.3; border:none; cursor:pointer; }
    .carousel-dot.active { opacity:1; background:var(--accent); width:16px; border-radius:3px; }

    @media (max-width:600px) {
      .gallery-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container">
    <a href="index.html" class="logo">
      <span class="logo-img logo-font">2</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">الرئيسية</a>
      <a href="gallery.html" class="active">المعرض</a>
      <a href="network.html">القنوات والبوتات</a>
    </nav>
    <div class="menu-toggle"><span></span><span></span><span></span></div>
  </div>
</header>

<main class="page-main">
  <div class="gallery-page">
    <div class="container">
      <h1 class="section-title">المعرض</h1>
      <p class="section-subtitle">تصاميمنا وإبداعاتنا — كل تصميم يحكي قصة</p>

      <div class="gallery-filters" id="gallery-filters">
        <button class="gallery-filter active" data-filter="all">الكل</button>
        <button class="gallery-filter" data-filter="individual">فردي</button>
        <button class="gallery-filter" data-filter="series">سلسلة</button>
        <button class="gallery-filter" data-filter="carousel">كاروسيل</button>
      </div>

      <div class="gallery-grid" id="gallery-grid">
        <!-- Items loaded by JS -->
      </div>
    </div>
  </div>
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev">&lsaquo;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lb-next">&rsaquo;</button>
</div>

<footer class="footer">
  <div class="footer-content">
    <div class="footer-logo">
      <span class="logo-img logo-font">2</span>
    </div>
    <div class="footer-links">
      <a href="index.html">الرئيسية</a>
      <a href="gallery.html">المعرض</a>
      <a href="network.html">القنوات والبوتات</a>
    </div>
    <div class="footer-copy">جميع الحقوق محفوظة &copy; 2025 - 2026 فريق آفاق</div>
  </div>
</footer>

<script src="js/kufam-font.js"></script>
<script>
(function () {
  'use strict';

  // ===== Gallery Data =====
  var galleryData = [
    {
      id: 1, title: 'بسم الله الرحمن الرحيم', desc: 'تصميم آية البسملة بالخط الرقمي', type: 'individual',
      images: ['1.jpg']
    },
    {
      id: 2, title: 'سورة الفاتحة', desc: 'سلسلة آيات الفاتحة بالخط الرقمي', type: 'series',
      images: ['2.jpg']
    },
    {
      id: 3, title: 'الكرسي', desc: 'تصميم آية الكرسي مميز', type: 'individual',
      images: ['3.jpg']
    },
    {
      id: 4, title: 'الأسماء الحسنى', desc: 'سلسلة أسماء الله الحسنى', type: 'series',
      images: ['4_1.jpg', '4_2.jpg', '4_3.jpg']
    },
    {
      id: 5, title: 'ليلية هادئة', desc: 'تصميم ليلي مع آيات السكينة', type: 'individual',
      images: ['5.jpg']
    },
    {
      id: 6, title: 'رمضان كريم', desc: 'مجموعة تصاميم رمضانية متسلسلة', type: 'carousel',
      images: ['6_1.jpg', '6_2.jpg', '6_3.jpg', '6_4.jpg']
    },
    {
      id: 7, title: 'سبحان الله', desc: 'تصميم تسبيح مميز', type: 'individual',
      images: ['7.jpg']
    },
    {
      id: 8, title: 'آيات النور', desc: 'سلسلة آيات النور والهداية', type: 'series',
      images: ['8_1.jpg', '8_2.jpg']
    },
    {
      id: 9, title: 'القدس', desc: 'تصميم يعبر عن القدس', type: 'individual',
      images: ['9.jpg']
    },
    {
      id: 10, title: 'الصلاة على النبي', desc: 'مجموعة متنوعة للصلاة على النبي', type: 'carousel',
      images: ['10_1.jpg', '10_2.jpg', '10_3.jpg']
    },
    {
      id: 11, title: 'الشفاء', desc: 'آيات الشفاء والرقية', type: 'individual',
      images: ['11.jpg']
    },
    {
      id: 12, title: 'الفجر', desc: 'تصميم عن وقت الفجر', type: 'individual',
      images: ['12.jpg']
    },
  ];

  var currentFilter = 'all';
  var lightboxItems = [];
  var lightboxIndex = 0;

  // ===== Render Gallery =====
  function renderGallery(filter) {
    var grid = document.getElementById('gallery-grid');
    if (!grid) return;
    grid.innerHTML = '';
    var items = filter === 'all' ? galleryData : galleryData.filter(function (d) { return d.type === filter; });
    items.forEach(function (item) {
      var col = document.createElement('div');
      col.className = 'gallery-item';
      col.dataset.id = item.id;
      col.dataset.type = item.type;

      var badgeMap = { individual: 'فردي', series: 'سلسلة', carousel: 'كاروسيل' };
      var badge = document.createElement('div');
      badge.className = 'gallery-item-badge';
      badge.textContent = badgeMap[item.type] || '';

      var imgWrap = document.createElement('div');
      imgWrap.style.position = 'relative';

      if (item.type === 'carousel' && item.images.length > 1) {
        // Carousel inside the card
        var track = document.createElement('div');
        track.className = 'carousel-track';
        item.images.forEach(function (src, si) {
          var img = document.createElement('img');
          img.className = 'carousel-item';
          img.src = './assets/gallery/' + src;
          img.alt = item.title + ' ' + (si + 1);
          img.loading = 'lazy';
          img.onerror = placeholderSVG;
          track.appendChild(img);
        });
        imgWrap.appendChild(track);
        // Dots
        if (item.images.length > 1) {
          var dots = document.createElement('div');
          dots.className = 'carousel-dots';
          item.images.forEach(function (_, di) {
            var dot = document.createElement('button');
            dot.className = 'carousel-dot' + (di === 0 ? ' active' : '');
            dot.onclick = function (e) { e.stopPropagation(); scrollTo(track, di); };
            dots.appendChild(dot);
          });
          imgWrap.appendChild(dots);
          // Update dots on scroll
          track.addEventListener('scroll', function () {
            var idx = Math.round(track.scrollLeft / track.offsetWidth);
            dots.querySelectorAll('.carousel-dot').forEach(function (d, i) {
              d.classList.toggle('active', i === idx);
            });
          });
        }
      } else {
        var img = document.createElement('img');
        img.className = 'gallery-item-img';
        img.src = './assets/gallery/' + item.images[0];
        img.alt = item.title;
        img.loading = 'lazy';
        img.onerror = placeholderSVG;
        imgWrap.appendChild(img);
      }

      imgWrap.appendChild(badge);

      var info = document.createElement('div');
      info.className = 'gallery-item-info';
      info.innerHTML = '<div class="gallery-item-title">' + item.title + '</div><div class="gallery-item-desc">' + item.desc + '</div>';

      col.appendChild(imgWrap);
      col.appendChild(info);

      col.addEventListener('click', function () {
        openLightbox(item);
      });

      grid.appendChild(col);
    });
  }

  function placeholderSVG() {
    this.style.display = 'none';
    var p = this.parentNode;
    var ph = document.createElement('div');
    ph.className = 'gallery-placeholder';
    ph.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48"><path fill-rule="evenodd" d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z" clip-rule="evenodd"/></svg>';
    if (p) p.appendChild(ph);
  }

  function scrollTo(el, idx) {
    el.scrollTo({ left: el.offsetWidth * idx, behavior: 'smooth' });
  }

  // ===== Lightbox =====
  function openLightbox(item) {
    lightboxItems = item.images;
    lightboxIndex = 0;
    showLightboxImage();
    document.getElementById('lightbox').classList.add('open');
  }

  function showLightboxImage() {
    var img = document.getElementById('lightbox-img');
    img.src = './assets/gallery/' + lightboxItems[lightboxIndex];
    document.getElementById('lb-prev').style.display = lightboxItems.length > 1 ? '' : 'none';
    document.getElementById('lb-next').style.display = lightboxItems.length > 1 ? '' : 'none';
  }

  window.openLightbox = openLightbox;
  window.closeLightbox = function (e) {
    if (!e || e.target === e.currentTarget || e.target.classList.contains('lightbox-close')) {
      document.getElementById('lightbox').classList.remove('open');
    }
  };

  document.getElementById('lb-prev').addEventListener('click', function (e) { e.stopPropagation(); if (lightboxIndex > 0) { lightboxIndex--; showLightboxImage(); } });
  document.getElementById('lb-next').addEventListener('click', function (e) { e.stopPropagation(); if (lightboxIndex < lightboxItems.length - 1) { lightboxIndex++; showLightboxImage(); } });

  document.addEventListener('keydown', function (e) {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight' && lightboxIndex > 0) { lightboxIndex--; showLightboxImage(); }
    if (e.key === 'ArrowLeft' && lightboxIndex < lightboxItems.length - 1) { lightboxIndex++; showLightboxImage(); }
  });

  // ===== Filters =====
  var filterBtns = document.querySelectorAll('.gallery-filter');
  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderGallery(currentFilter);
    });
  });

  // ===== Header scroll =====
  var header = document.querySelector('.header');
  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      requestAnimationFrame(function () {
        header.classList.toggle('scrolled', window.scrollY > 50);
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  var menuToggle = document.querySelector('.menu-toggle');
  var navLinks = document.querySelector('.nav-links');
  if (menuToggle) {
    menuToggle.addEventListener('click', function () {
      menuToggle.classList.toggle('active');
      navLinks.classList.toggle('open');
    });
  }
  document.querySelectorAll('.nav-links a').forEach(function (link) {
    link.addEventListener('click', function () {
      if (menuToggle) menuToggle.classList.remove('active');
      if (navLinks) navLinks.classList.remove('open');
    });
  });

  // ===== Init =====
  renderGallery('all');
})();
</script>
</body>
</html>
